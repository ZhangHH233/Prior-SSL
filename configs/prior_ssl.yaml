seed: 42
device: cuda

data:
  image_size: [512, 512]
  num_classes: 2
  dataset: goals
  goals_root: ./data/GOALS
  split_mode: label10
  split_seed: 42
  val_ratio: 0.2
  split_csv:
  binary_target: choroid
  image_exts: ["*.png", "*.jpg", "*.jpeg", "*.bmp", "*.tif", "*.tiff"]

  train_images: ./data/GOALS/Train/Image
  train_masks: ./data/GOALS/Train/Layer_Masks
  val_images:
  val_masks:
  unlabeled_images:

  # If masks have the same filename stem as images, leave this empty.
  mask_suffix: ""

model:
  name: resunet
  in_channels: 3
  base_channels: 32

train:
  epochs: 80
  batch_size: 4
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  ce_weight: 1.0
  dice_weight: 1.0
  amp: true
  log_interval: 20
  output_dir: ResSave/label10/pretrain
  tensorboard_dir: ResSave/label10/tensorboard/pretrain

pseudo:
  output_dir: ResSave/label10/pseudo
  batch_size: 4
  num_workers: 0
  mask_threshold: 0.5
  uncertainty_upper_bound: 0.75
  uncertainty_beta: 1.0
  final_threshold: 0.6
  selection_metric: final_fg_mean
  mag_lambda: 0.5
  pca_components: 2
  prior_clusters: 3
  kmeans_max_iter: 100
  prior_tolerance_sigma: 3.0
  perturbation: hflip
  save_confidence_png: true

retrain:
  epochs: 80
  batch_size: 4
  num_workers: 4
  lr: 0.00005
  weight_decay: 0.0001
  ce_weight: 1.0
  dice_weight: 1.0
  amp: true
  pseudo_weight: 0.5
  min_sample_confidence: 0.6
  output_dir: ResSave/label10/retrain
  tensorboard_dir: ResSave/label10/tensorboard/retrain
